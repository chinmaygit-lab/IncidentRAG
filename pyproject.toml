[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentrag"
version = "1.0.2"
description = "Grounded incident-response RAG with BM25, offline dense retrieval, RRF, reranking, abstention, citations, PostgreSQL FTS and pgvector adapters."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "IncidentRAG Contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.3,<10", "coverage>=7.6,<8", "ruff>=0.8,<1"]

[project.scripts]
incidentrag = "incidentrag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
